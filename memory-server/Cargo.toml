[package]
name = "causality"                                                             # 因果律
version = "0.1.2"
edition = "2021"
description = "A context memory governance service for Agent/LLM applications"
authors = ["xiaoshuyui"]

[dependencies]
# Web framework
axum = { version = "0.8.9", features = ["macros"] }
tower-http = { version = "0.5", features = [
    "cors",
    "trace",
    "request-id",
    "timeout",
] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
] }

# Vector database
qdrant-client = "1.18"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Types
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Configuration
config = "0.14"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics
metrics = "0.22"
metrics-exporter-prometheus = "0.13"

# HTTP client (for embedding providers)
reqwest = { version = "0.12", features = ["json"] }

# Openai API client
async-openai = "0.27"
futures = "0.3"

# Error handling
thiserror = "1"
anyhow = "1"

# Utilities
async-trait = "0.1"

# API Documentation
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

[dev-dependencies]
proptest = "1"
tokio-test = "0.4"
testcontainers = "0.15"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
