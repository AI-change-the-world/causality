# Memory Server Docker Compose Configuration
# Run with: docker-compose up -d
# Requirements: 6.1, 6.3, 6.4, 6.5, 6.6

version: '3.8'

services:
  # ============================================
  # Memory Server - Main Application
  # ============================================
  memory-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memory-server
    ports:
      - "${MEMORY_SERVER_PORT:-8080}:8080"
    environment:
      # Use docker config file for internal network URLs
      - CONFIG_PATH=/app/config/config.docker.yaml
      - RUST_LOG=${RUST_LOG:-info}
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - memory-network

  # ============================================
  # PostgreSQL - Primary Database
  # ============================================
  postgres:
    image: postgres:16
    container_name: memory-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-memory}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-memory}
      - POSTGRES_DB=${POSTGRES_DB:-memory_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memory} -d ${POSTGRES_DB:-memory_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - memory-network

  # ============================================
  # Qdrant - Vector Database
  # ============================================
  qdrant:
    image: qdrant/qdrant:v1.16.3
    container_name: memory-qdrant
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - memory-network

# ============================================
# Named Volumes for Data Persistence
# ============================================
volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local

# ============================================
# Network Configuration
# ============================================
networks:
  memory-network:
    driver: bridge
