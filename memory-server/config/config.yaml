# Memory Server Configuration
# Development mode - connects to localhost with exposed ports

server:
  host: "0.0.0.0"
  port: 18081

# PostgreSQL - localhost for development
database:
  url: "postgres://memory:memory@localhost:5432/memory_db"
  max_connections: 10
  min_connections: 2
  run_migrations: false # Set to true for fresh database

# Qdrant - localhost for development
qdrant:
  url: "http://localhost:6334"
  collection_name: "memories"

# Embedding providers are managed via API
# POST /api/v1/config/providers
embedding:
  default_provider: null
  providers: []

# LLM providers are managed via API
# POST /api/v1/config/llm-providers
llm:
  default_provider: null
  providers: []

lifecycle:
  cooldown_check_interval_seconds: 3600
  decay_config:
    base_decay_rate: 0.05
    hit_count_weight: 0.1
    recency_weight: 0.3
    importance_weight: 0.2
    min_decay_score: 0.01
  eviction_config:
    cooldown_threshold_days: 7
    candidate_threshold_days: 14
    archive_threshold_days: 30
    max_memories_per_scope: 1000
    max_global_memories: 10000
    batch_size: 100

retrieval:
  default_top_k: 10
  max_top_k: 100
  cooldown_penalty: 0.5
  score_weights:
    similarity: 0.35
    importance: 0.25
    recency: 0.15
    hit_count: 0.1
    fulltext: 0.15

audit:
  enabled: true
  retention_days: 90
