# Memory Server Configuration Example
# Copy this file to config.yaml and update values as needed
# Environment variables can be used with ${VAR_NAME} syntax
# Requirements: 7.1, 7.2

# ============================================
# Server Configuration
# ============================================
server:
  # Host to bind to (0.0.0.0 for all interfaces)
  host: "0.0.0.0"
  # Port to listen on
  port: 8080

# ============================================
# PostgreSQL Database Configuration
# ============================================
database:
  # Database connection URL
  # Format: postgres://user:password@host:port/database
  # Use environment variable for sensitive data
  url: "${DATABASE_URL}"
  # Maximum number of connections in the pool
  max_connections: 10
  # Minimum number of connections to maintain
  min_connections: 2

# ============================================
# Qdrant Vector Database Configuration
# ============================================
qdrant:
  # Qdrant server URL (gRPC port)
  url: "${QDRANT_URL}"
  # Collection name for storing memory vectors
  collection_name: "memories"

# ============================================
# Embedding Provider Configuration
# ============================================
embedding:
  # Default provider to use when not specified
  default_provider: "openai"
  
  # List of available embedding providers
  providers:
    # OpenAI Embedding Provider
    - name: "openai"
      type: "openai"
      endpoint: "https://api.openai.com/v1"
      api_key: "${OPENAI_API_KEY}"
      model: "text-embedding-3-small"
      dimension: 1536
      rate_limit:
        requests_per_minute: 500
        tokens_per_minute: 1000000
    
    # Local Embedding Provider (e.g., BGE model via Ollama or custom service)
    - name: "local-bge"
      type: "local"
      endpoint: "http://embedding-service:8000/v1"
      model: "bge-large-zh-v1.5"
      dimension: 1024
      rate_limit:
        requests_per_minute: 1000

# ============================================
# Memory Lifecycle Configuration
# ============================================
lifecycle:
  # Interval (in seconds) to check for memories to transition to cooldown
  cooldown_check_interval_seconds: 3600
  
  # Thresholds (in seconds) for transitioning to cooldown status
  # Based on time since last hit
  cooldown_thresholds:
    session: 86400      # 1 day
    task: 604800        # 7 days
    long_term: 2592000  # 30 days
  
  # Default TTL (in seconds) for each layer
  # null means no automatic expiration
  default_ttl:
    session: 3600       # 1 hour
    task: 604800        # 7 days
    long_term: null     # no expiry

# ============================================
# Retrieval Configuration
# ============================================
retrieval:
  # Default number of results to return
  default_top_k: 10
  # Maximum allowed top_k value
  max_top_k: 100
  # Score penalty factor for memories in cooldown status (0.0 - 1.0)
  cooldown_penalty: 0.5
  
  # Weights for composite score calculation
  # All weights should sum to 1.0
  score_weights:
    similarity: 0.35    # Vector similarity weight
    importance: 0.25    # Memory importance weight
    recency: 0.15       # How recently the memory was created/updated
    hit_count: 0.1      # How often the memory has been retrieved
    fulltext: 0.15      # Full-text search match weight

# ============================================
# Audit Configuration
# ============================================
audit:
  # Enable/disable audit logging
  enabled: true
  # Number of days to retain audit logs
  retention_days: 90
