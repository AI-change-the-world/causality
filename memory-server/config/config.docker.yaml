# Memory Server Configuration
# Docker mode - connects to containers via internal network

server:
  host: "0.0.0.0"
  port: 8080

# PostgreSQL - internal docker network
database:
  url: "postgres://memory:memory@postgres:5432/memory_db"
  max_connections: 10
  min_connections: 2
  run_migrations: true  # Auto-migrate in docker

# Qdrant - internal docker network
qdrant:
  url: "http://qdrant:6334"
  collection_name: "memories"

# LLM provider configuration (single provider from config)
# API key can be overridden via MEMORY_SERVER__LLM__API_KEY
llm:
  provider_type: openai  # openai | azure | local
  endpoint: "https://api.openai.com/v1"
  api_key: ""  # Set via environment variable for security
  model: "gpt-4o-mini"

# Embedding provider configuration (single provider from config)
# API key can be overridden via MEMORY_SERVER__EMBEDDING__API_KEY
embedding:
  provider_type: openai  # openai | azure | local
  endpoint: "https://api.openai.com/v1"
  api_key: ""  # Set via environment variable for security
  model: "text-embedding-3-small"
  dimension: 1536

lifecycle:
  cooldown_check_interval_seconds: 3600
  decay_config:
    base_decay_rate: 0.05
    hit_count_weight: 0.1
    recency_weight: 0.3
    importance_weight: 0.2
    min_decay_score: 0.01
  eviction_config:
    cooldown_threshold_days: 7
    candidate_threshold_days: 14
    archive_threshold_days: 30
    max_memories_per_scope: 1000
    max_global_memories: 10000
    batch_size: 100

retrieval:
  default_top_k: 10
  max_top_k: 100
  cooldown_penalty: 0.5
  score_weights:
    similarity: 0.35
    importance: 0.25
    recency: 0.15
    hit_count: 0.1
    fulltext: 0.15

audit:
  enabled: true
  retention_days: 90
