# Memory Server Configuration
# Docker mode - connects to containers via internal network

server:
  host: "0.0.0.0"
  port: 8080

# PostgreSQL - internal docker network
database:
  url: "postgres://memory:memory@postgres:5432/memory_db"
  max_connections: 10
  min_connections: 2
  run_migrations: true  # Auto-migrate in docker

# Qdrant - internal docker network
qdrant:
  url: "http://qdrant:6334"
  collection_name: "memories"

# Embedding providers are managed via API
# POST /api/v1/config/providers
embedding:
  default_provider: null
  providers: []

# LLM providers are managed via API
# POST /api/v1/config/llm-providers
llm:
  default_provider: null
  providers: []

lifecycle:
  cooldown_check_interval_seconds: 3600
  cooldown_thresholds:
    session: 86400      # 1 day
    task: 604800        # 7 days
    long_term: 2592000  # 30 days
  default_ttl:
    session: 3600       # 1 hour
    task: 604800        # 7 days
    long_term: null     # no expiry

retrieval:
  default_top_k: 10
  max_top_k: 100
  cooldown_penalty: 0.5
  score_weights:
    similarity: 0.35
    importance: 0.25
    recency: 0.15
    hit_count: 0.1
    fulltext: 0.15

audit:
  enabled: true
  retention_days: 90
