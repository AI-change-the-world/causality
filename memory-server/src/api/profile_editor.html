<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile Prompt Editor</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0b1020;
      --panel: #121a2b;
      --panel-2: #182235;
      --border: #263247;
      --text: #e6edf7;
      --muted: #9fb0c8;
      --accent: #5aa0ff;
      --accent-2: #3d7ddd;
      --danger: #d96c6c;
      --ok: #41b37a;
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.25);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg, #0a1020 0%, #0e1422 100%);
      color: var(--text);
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
    }

    .sidebar {
      border-right: 1px solid var(--border);
      background: rgba(10, 16, 30, 0.86);
      backdrop-filter: blur(10px);
      padding: 20px 16px;
    }

    .main {
      padding: 24px;
    }

    .toolbar,
    .editor-head,
    .meta-grid {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .toolbar {
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .title {
      font-size: 18px;
      font-weight: 600;
      margin: 0;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .button {
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 8px;
      height: 36px;
      padding: 0 14px;
      cursor: pointer;
      font-size: 13px;
    }

    .button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 16px;
    }

    .profile-item {
      width: 100%;
      text-align: left;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
    }

    .profile-item.active {
      border-color: var(--accent);
      background: #152744;
    }

    .profile-name {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .profile-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      word-break: break-word;
    }

    .panel {
      border: 1px solid var(--border);
      background: rgba(18, 26, 43, 0.92);
      box-shadow: var(--shadow);
      border-radius: 8px;
      overflow: hidden;
    }

    .editor-head {
      justify-content: space-between;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
    }

    .meta-grid {
      flex-wrap: wrap;
      gap: 10px;
      align-items: stretch;
      padding: 16px 18px 0;
    }

    .meta-chip {
      min-width: 140px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      background: rgba(24, 34, 53, 0.9);
    }

    .meta-label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .meta-value {
      font-size: 13px;
      line-height: 1.45;
      word-break: break-word;
    }

    .editor-body {
      padding: 18px;
    }

    textarea {
      width: 100%;
      min-height: 520px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0e1524;
      color: var(--text);
      padding: 14px;
      font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .status {
      min-height: 20px;
      font-size: 13px;
      color: var(--muted);
      margin-top: 12px;
    }

    .status.error {
      color: var(--danger);
    }

    .status.success {
      color: var(--ok);
    }

    .empty,
    .loading {
      color: var(--muted);
      font-size: 13px;
      padding: 12px 4px;
    }

    @media (max-width: 980px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      textarea {
        min-height: 420px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="toolbar">
        <div>
          <h1 class="title">System Profiles</h1>
          <p class="subtitle">查看并编辑 extraction prompt</p>
        </div>
        <button id="refreshBtn" class="button" type="button">刷新</button>
      </div>
      <div id="profileList" class="list"></div>
      <div id="listState" class="loading">正在加载 profiles...</div>
    </aside>

    <main class="main">
      <div class="panel">
        <div class="editor-head">
          <div>
            <h2 id="editorTitle" class="title">请选择一个 profile</h2>
            <p id="editorSubtitle" class="subtitle">右侧只编辑 extraction_prompt，不会改其他字段</p>
          </div>
          <button id="saveBtn" class="button primary" type="button" disabled>保存 Prompt</button>
        </div>

        <div id="metaGrid" class="meta-grid"></div>

        <div class="editor-body">
          <textarea id="promptInput" placeholder="选择 profile 后在这里编辑 extraction_prompt" disabled></textarea>
          <div id="status" class="status"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const profileListEl = document.getElementById("profileList");
    const listStateEl = document.getElementById("listState");
    const refreshBtn = document.getElementById("refreshBtn");
    const saveBtn = document.getElementById("saveBtn");
    const promptInput = document.getElementById("promptInput");
    const statusEl = document.getElementById("status");
    const editorTitleEl = document.getElementById("editorTitle");
    const editorSubtitleEl = document.getElementById("editorSubtitle");
    const metaGridEl = document.getElementById("metaGrid");

    let profiles = [];
    let selectedProfileId = null;
    let selectedProfile = null;

    function setStatus(message, tone = "") {
      statusEl.textContent = message || "";
      statusEl.className = tone ? `status ${tone}` : "status";
    }

    function formatDate(value) {
      if (!value) return "-";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString();
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function renderMeta(profile) {
      if (!profile) {
        metaGridEl.innerHTML = "";
        return;
      }

      const items = [
        ["Profile ID", profile.id],
        ["Domain", profile.domain || "-"],
        ["Purpose", profile.purpose || "-"],
        ["Schema", `${profile.schema_status || "-"} / v${profile.schema_version ?? "-"}`],
        ["Updated", formatDate(profile.updated_at)],
      ];

      metaGridEl.innerHTML = items
        .map(([label, value]) => `
          <div class="meta-chip">
            <span class="meta-label">${escapeHtml(label)}</span>
            <span class="meta-value">${escapeHtml(value)}</span>
          </div>
        `)
        .join("");
    }

    function renderProfiles() {
      profileListEl.innerHTML = "";

      if (!profiles.length) {
        listStateEl.textContent = "当前没有 system profile。";
        listStateEl.className = "empty";
        return;
      }

      listStateEl.textContent = "";
      listStateEl.className = "";

      for (const profile of profiles) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "profile-item" + (profile.id === selectedProfileId ? " active" : "");
        button.innerHTML = `
          <div class="profile-name">${escapeHtml(profile.name || profile.id)}</div>
          <div class="profile-meta">
            <div>${escapeHtml(profile.domain || "未设置 domain")}</div>
            <div>${escapeHtml(profile.purpose || "未设置 purpose")}</div>
          </div>
        `;
        button.addEventListener("click", () => selectProfile(profile.id));
        profileListEl.appendChild(button);
      }
    }

    function updateEditor(profile) {
      selectedProfile = profile;
      selectedProfileId = profile ? profile.id : null;
      renderProfiles();
      renderMeta(profile);

      if (!profile) {
        editorTitleEl.textContent = "请选择一个 profile";
        editorSubtitleEl.textContent = "右侧只编辑 extraction_prompt，不会改其他字段";
        promptInput.value = "";
        promptInput.disabled = true;
        saveBtn.disabled = true;
        return;
      }

      editorTitleEl.textContent = profile.name || profile.id;
      editorSubtitleEl.textContent = profile.description || "无 description";
      promptInput.value = profile.extraction_prompt || "";
      promptInput.disabled = false;
      saveBtn.disabled = false;
    }

    async function loadProfiles(preferredId = null) {
      setStatus("");
      listStateEl.textContent = "正在加载 profiles...";
      listStateEl.className = "loading";

      const response = await fetch("/api/v1/systems");
      if (!response.ok) {
        throw new Error(`加载 profiles 失败: ${response.status}`);
      }

      profiles = await response.json();
      const nextId =
        preferredId && profiles.some((profile) => profile.id === preferredId)
          ? preferredId
          : profiles[0]?.id ?? null;

      renderProfiles();
      if (nextId) {
        await selectProfile(nextId, false);
      } else {
        updateEditor(null);
      }
    }

    async function selectProfile(profileId, fetchRemote = true) {
      selectedProfileId = profileId;
      renderProfiles();

      let profile = profiles.find((item) => item.id === profileId) || null;
      if (fetchRemote && profileId) {
        const response = await fetch(`/api/v1/systems/${profileId}`);
        if (!response.ok) {
          throw new Error(`加载 profile 详情失败: ${response.status}`);
        }
        profile = await response.json();
        profiles = profiles.map((item) => (item.id === profile.id ? profile : item));
      }

      updateEditor(profile);
    }

    async function savePrompt() {
      if (!selectedProfile) return;

      saveBtn.disabled = true;
      setStatus("正在保存...", "");

      const response = await fetch(`/api/v1/systems/${selectedProfile.id}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          extraction_prompt: promptInput.value,
          reparse: false,
        }),
      });

      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(errorText || `保存失败: ${response.status}`);
      }

      const updated = await response.json();
      profiles = profiles.map((item) => (item.id === updated.id ? updated : item));
      updateEditor(updated);
      setStatus("保存成功。", "success");
      saveBtn.disabled = false;
    }

    refreshBtn.addEventListener("click", async () => {
      refreshBtn.disabled = true;
      try {
        await loadProfiles(selectedProfileId);
        setStatus("已刷新。", "success");
      } catch (error) {
        setStatus(error.message || String(error), "error");
      } finally {
        refreshBtn.disabled = false;
      }
    });

    saveBtn.addEventListener("click", async () => {
      try {
        await savePrompt();
      } catch (error) {
        setStatus(error.message || String(error), "error");
        saveBtn.disabled = false;
      }
    });

    promptInput.addEventListener("input", () => {
      if (!selectedProfile) return;
      setStatus("有未保存修改。");
    });

    (async function init() {
      try {
        await loadProfiles();
      } catch (error) {
        updateEditor(null);
        setStatus(error.message || String(error), "error");
        listStateEl.textContent = "加载失败。";
        listStateEl.className = "empty";
      }
    })();
  </script>
</body>
</html>
